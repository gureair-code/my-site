<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月次コメント作成フォーム v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --bg: #0f1117; --surface: #181c27; --surface2: #1e2335; --surface3: #252c42;
  --border: #2e3650; --border-bright: #3d4f7a;
  --accent: #4f8ef7; --accent2: #7c5ef7; --green: #3ecf8e;
  --red: #f75454; --orange: #f79c48;
  --text: #e8eaf0; --text-sub: #8892aa; --text-dim: #555f7a;
  --radius: 10px; --shadow: 0 4px 20px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px 20px 60px; }
.container { max-width: 960px; margin: 0 auto; }

header { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.header-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--orange), var(--accent2)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 16px rgba(247,156,72,.3); flex-shrink: 0; }
h1 { font-size: 20px; font-weight: 700; }
h1 span { color: var(--text-sub); font-weight: 400; font-size: 13px; margin-left: 10px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; padding: 16px; transition: border-color .2s; }
.section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; transition: border-color .2s; }
.card:hover, .section-card:hover { border-color: var(--border-bright); }

.section-header { display: flex; align-items: center; gap: 10px; padding: 13px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
.section-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 4px; flex-shrink: 0; }
.tag-blue { background: rgba(79,142,247,.15); color: var(--accent); }
.tag-green { background: rgba(62,207,142,.12); color: var(--green); }
.tag-orange { background: rgba(247,156,72,.15); color: var(--orange); }
.tag-purple { background: rgba(124,94,247,.15); color: var(--accent2); }
.section-title { font-size: 14px; font-weight: 500; flex: 1; }
.collapse-icon { color: var(--text-dim); font-size: 14px; transition: transform .2s; }
.section-card.collapsed .collapse-icon { transform: rotate(-90deg); }
.section-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.section-card.collapsed .section-body { display: none; }

/* Inputs */
label { font-size: 11px; color: var(--text-sub); font-weight: 500; letter-spacing: .06em; }
input[type="text"], input[type="number"], input[type="month"], select, textarea {
  background: var(--surface3); border: 1px solid var(--border); border-radius: 7px;
  color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 13px;
  padding: 8px 10px; transition: border-color .2s, background .2s; outline: none; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #1e2840; }
input::placeholder, textarea::placeholder { color: var(--text-dim); }
select option { background: #252c42; }
textarea { resize: vertical; min-height: 80px; line-height: 1.7; }
textarea.tall { min-height: 120px; }

.fg { display: flex; flex-direction: column; gap: 5px; }
.field-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.field-row .fg { flex: 1; min-width: 140px; }

.hint-text { font-size: 11px; color: var(--text-dim); background: rgba(255,255,255,.03); border-left: 2px solid var(--border); padding: 6px 10px; border-radius: 0 4px 4px 0; line-height: 1.6; }

/* Period panels */
.result-months { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width:640px) { .result-months { grid-template-columns: 1fr; } }

.period-panel { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.period-panel-hd { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: rgba(15,17,23,.5); border-bottom: 1px solid var(--border); }
.month-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-prev { background: var(--text-dim); }
.dot-curr { background: var(--accent); box-shadow: 0 0 6px rgba(79,142,247,.6); }
.period-panel-hd input { background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 2px 4px; font-size: 13px; font-weight: 500; }
.period-panel-hd input:focus { border-bottom-color: var(--accent); background: transparent; }
.period-panel-hd input.period-note { font-size: 11px; color: var(--text-sub); }
.period-panel-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

/* Result platform blocks */
.rp-block { background: var(--surface3); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.rp-block-hd { display: flex; align-items: center; gap: 6px; padding: 7px 10px; background: rgba(20,25,40,.8); border-bottom: 1px solid var(--border); }
.rp-block-hd select { flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 2px 4px; font-size: 13px; font-weight: 600; }
.rp-block-hd select:focus { border-bottom-color: var(--accent); background: transparent; }
.rp-metrics { padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; }

.mrow { display: flex; align-items: center; gap: 6px; }
.mlabel { font-size: 11px; color: var(--text-sub); flex-shrink: 0; width: 52px; }
.mlabel-in { width: 130px; flex-shrink: 0; }
.mlabel-in input { padding: 4px 6px; font-size: 11px; font-weight: 600; color: var(--text-sub); }
.minput { flex: 1; min-width: 0; }
.minput input { padding: 5px 7px; font-size: 13px; }
.munit { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

.cpa-auto { background: var(--surface2) !important; color: var(--green) !important; font-family: 'JetBrains Mono', monospace !important; font-weight: 600 !important; cursor: default; }

/* Sub-CVs */
.subcv-row { display: flex; align-items: center; gap: 5px; padding-left: 12px; }
.subcv-prefix { font-size: 12px; color: var(--text-sub); flex-shrink: 0; }
.subcv-row input { padding: 4px 6px; font-size: 12px; }
.subcv-name { width: 90px; flex-shrink: 0; }
.subcv-val { flex: 1; }

/* Extra metrics */
.em-block { background: rgba(15,17,23,.4); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
.em-row { display: flex; align-items: center; gap: 5px; }
.em-row input { padding: 4px 6px; font-size: 12px; }
.em-name { flex: 2; }
.em-val { flex: 2; }
.em-unit { flex: 1; min-width: 0; }
.sm-row { display: flex; align-items: center; gap: 4px; padding-left: 12px; }
.sm-prefix { font-size: 11px; color: var(--text-dim); }
.sm-row input { padding: 3px 5px; font-size: 11px; }

/* 施策 / 所感 platform blocks */
.sp-block, .kp-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.sp-hd, .kp-hd { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(15,17,23,.4); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; }
.sp-hd select, .kp-hd select { background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 2px 4px; font-size: 12px; font-weight: 600; flex: 1; }
.sp-body, .kp-body { padding: 8px 12px; }
.sp-body textarea, .kp-body textarea { min-height: 60px; font-size: 12px; }

/* Options */
.options-row { display: flex; gap: 16px; flex-wrap: wrap; }
.check-wrap { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.check-wrap input[type="checkbox"] { width: auto; accent-color: var(--accent); }
.check-wrap span { font-size: 12px; color: var(--text-sub); }

.row-between { display: flex; align-items: center; justify-content: space-between; }
.section-label { font-size: 11px; color: var(--text-sub); font-weight: 500; letter-spacing: .06em; }
.divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

/* Buttons */
.btn-add { background: none; border: 1px dashed var(--border); color: var(--text-sub); border-radius: 6px; padding: 5px 12px; font-size: 11px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all .15s; }
.btn-add:hover { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,.06); }
.btn-add.sm { padding: 3px 8px; font-size: 10px; }
.btn-x { background: none; border: none; cursor: pointer; color: var(--text-dim); padding: 3px 5px; border-radius: 4px; font-size: 12px; transition: all .15s; line-height: 1; flex-shrink: 0; }
.btn-x:hover { color: var(--red); background: rgba(247,84,84,.1); }

/* Output */
.output-section { margin-top: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.output-hd { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); }
.output-title { font-size: 12px; color: var(--text-sub); font-weight: 500; letter-spacing: .06em; }
.output-actions { display: flex; gap: 8px; }
.btn-gen { background: linear-gradient(135deg, var(--orange), var(--accent2)); border: none; color: #fff; border-radius: 7px; padding: 8px 20px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all .2s; box-shadow: 0 2px 12px rgba(247,156,72,.3); }
.btn-gen:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(247,156,72,.4); }
.btn-copy { background: var(--surface3); border: 1px solid var(--border); color: var(--text-sub); border-radius: 7px; padding: 8px 14px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: all .15s; }
.btn-copy:hover { color: var(--text); border-color: var(--border-bright); }
.btn-copy.copied { color: var(--green); border-color: var(--green); background: rgba(62,207,142,.08); }
#output { display: block; width: 100%; background: transparent; border: none; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.9; padding: 16px; resize: vertical; min-height: 300px; outline: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-icon">📝</div>
    <div><h1>月次コメント作成フォーム <span>v2 — CPA自動計算 + 媒体別対応</span></h1></div>
  </header>

  <!-- ─── Meta ─── -->
  <div class="card">
    <div class="field-row">
      <div class="fg"><label>クライアント名（任意）</label><input type="text" id="clientName" placeholder="例：株式会社〇〇"></div>
      <div class="fg" style="max-width:140px"><label>レポート作成月</label><input type="month" id="reportMonth" style="color-scheme:dark"></div>
      <div class="fg" style="max-width:80px"><label>月ヘッダー記号</label>
        <select id="monthSymbol"><option value="◆">◆（一般）</option><option value="■">■（サンプル④）</option></select>
      </div>
    </div>
    <div class="field-row" style="margin-top:12px">
      <div class="fg">
        <label>フォーマットスタイル</label>
        <select id="formatStyle">
          <option value="A">A型：◆＜Google＞2月実績 ／ 【結果/所感】＜Google広告＞（サンプル①）</option>
          <option value="B">B型：◆3月実績 → 【Google】サブヘッダー ／ Google：所感（サンプル②）</option>
          <option value="C">C型：◆2月実績（シンプル・単一媒体、サンプル③④）</option>
        </select>
      </div>
      <div class="fg" style="max-width:170px"><label>施策 見出しノート</label><input type="text" id="sessakuNote" placeholder="例：3/1開始"></div>
      <div class="fg" style="max-width:160px"><label>結果セクション見出し</label><input type="text" id="resultHeader" value="前月の結果"></div>
    </div>
  </div>

  <!-- ─── 01 現状の課題 ─── -->
  <div class="section-card" id="card-1">
    <div class="section-header" onclick="toggleCard('card-1')">
      <span class="section-tag tag-blue">■ 01</span><span class="section-title">現状の課題</span><span class="collapse-icon">⌄</span>
    </div>
    <div class="section-body">
      <div class="hint-text">管理シート O列（今月分）</div>
      <textarea id="kadai" placeholder="例：問い合わせ数アップ（CV率の改善）"></textarea>
    </div>
  </div>

  <!-- ─── 02 前月の施策 ─── -->
  <div class="section-card" id="card-2">
    <div class="section-header" onclick="toggleCard('card-2')">
      <span class="section-tag tag-orange">■ 02</span><span class="section-title">前月の施策</span><span class="collapse-icon">⌄</span>
    </div>
    <div class="section-body">
      <div class="hint-text">管理シート P列（前月分）</div>
      <div class="fg"><label>＜共通＞ / 全体施策</label><textarea id="sessaku-common" placeholder="例：検索語句キーワードの除外&#10;予算の調整"></textarea></div>
      <div id="sessaku-platforms" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="btn-add" onclick="addSP()">＋ 媒体別施策を追加</button>
    </div>
  </div>

  <!-- ─── 03 前月の結果 ─── -->
  <div class="section-card" id="card-3">
    <div class="section-header" onclick="toggleCard('card-3')">
      <span class="section-tag tag-green">■ 03</span><span class="section-title">前月の結果</span><span class="collapse-icon">⌄</span>
    </div>
    <div class="section-body">
      <div class="options-row">
        <label class="check-wrap"><input type="checkbox" id="useSep"><span>実績ブロックの前後に区切り線（---------）を挿入</span></label>
        <label class="check-wrap"><input type="checkbox" id="useKansouHd" checked><span>【結果/所感】ヘッダーを出力</span></label>
      </div>

      <!-- Period panels -->
      <div class="result-months">
        <div class="period-panel">
          <div class="period-panel-hd">
            <span class="month-dot dot-prev"></span>
            <input type="text" id="prev-title" placeholder="例：2月実績" style="flex:1" oninput="this.dataset.edited=1">
            <input type="text" id="prev-note" class="period-note" placeholder="補足（例：（春期講習）※...）" style="flex:1.2">
          </div>
          <div class="period-panel-body">
            <div id="prev-platforms" style="display:flex;flex-direction:column;gap:8px"></div>
            <button class="btn-add" onclick="addRP('prev')">＋ 媒体追加</button>
          </div>
        </div>
        <div class="period-panel">
          <div class="period-panel-hd">
            <span class="month-dot dot-curr"></span>
            <input type="text" id="curr-title" placeholder="例：3月実績" style="flex:1" oninput="this.dataset.edited=1">
            <input type="text" id="curr-note" class="period-note" placeholder="補足" style="flex:1.2">
          </div>
          <div class="period-panel-body">
            <div id="curr-platforms" style="display:flex;flex-direction:column;gap:8px"></div>
            <button class="btn-add" onclick="addRP('curr')">＋ 媒体追加</button>
          </div>
        </div>
      </div>

      <hr class="divider">

      <!-- 結果/所感 -->
      <div>
        <div class="row-between" style="margin-bottom:8px">
          <span class="section-label">結果 / 所感テキスト</span>
          <label class="check-wrap"><input type="checkbox" id="kansouPer" onchange="toggleKansou()"><span>媒体別に分けて入力</span></label>
        </div>
        <div id="kansou-general"><textarea id="kansou-text" class="tall" placeholder="【結果/所感】配下のテキスト。改行もそのまま反映されます。"></textarea></div>
        <div id="kansou-per" style="display:none;flex-direction:column;gap:8px">
          <div id="kansou-list" style="display:flex;flex-direction:column;gap:8px"></div>
          <button class="btn-add" onclick="addKP()">＋ 媒体別所感を追加</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── 04 今後の対策 ─── -->
  <div class="section-card" id="card-4">
    <div class="section-header" onclick="toggleCard('card-4')">
      <span class="section-tag tag-purple">■ 04</span><span class="section-title">今後の対策（ネクストアクション）</span><span class="collapse-icon">⌄</span>
    </div>
    <div class="section-body">
      <div class="hint-text">管理シート P列（今月分）</div>
      <textarea id="naction" class="tall" placeholder="例：P-MAX予算配分調整&#10;キーワード精査調整"></textarea>
    </div>
  </div>

  <!-- ─── Output ─── -->
  <div class="output-section">
    <div class="output-hd">
      <span class="output-title">▼ 生成テキスト</span>
      <div class="output-actions">
        <button class="btn-copy" id="copyBtn" onclick="copyOutput()">コピー</button>
        <button class="btn-gen" onclick="generate()">テキスト生成 →</button>
      </div>
    </div>
    <textarea id="output" readonly placeholder="「テキスト生成」ボタンを押すとここに出力されます"></textarea>
  </div>
</div>

<script>
const PLATFORMS = ['Google','Yahoo','Meta','Instagram','Facebook','LINE','Twitter','TikTok','YouTube'];

// ─── COUNTER DECLARATIONS (must be before IIFE) ───
let spC=0, rpC=0, scC=0, emC=0, smC=0, kpC=0;

// ─── INIT ───
(function(){
  const now = new Date();
  const m = document.getElementById('reportMonth');
  m.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  updateMonthTitles();
  m.addEventListener('input', updateMonthTitles);
  addRP('prev'); addRP('curr');
})();

function updateMonthTitles(){
  const v = document.getElementById('reportMonth').value;
  if(!v) return;
  const [,m] = v.split('-').map(Number);
  const prev = m===1?12:m-1;
  const p = document.getElementById('prev-title');
  const c = document.getElementById('curr-title');
  if(!p.dataset.edited) p.value = `${prev}月実績`;
  if(!c.dataset.edited) c.value = `${m}月実績`;
}

function toggleCard(id){ document.getElementById(id).classList.toggle('collapsed'); }

// ─── NUM FORMAT ───
function parseNum(s){ return parseInt(String(s||'').replace(/[^0-9]/g,''))||0; }
function fmtN(n){ return Number(n).toLocaleString('ja-JP'); }
function fmtInput(el){ const r=el.value.replace(/[^0-9]/g,''); el.value = r ? fmtN(r) : ''; }

// ─── PLATFORM OPTIONS ───
function pOpts(sel){ return PLATFORMS.map(p=>`<option${p===sel?' selected':''}>${p}</option>`).join(''); }

// ─── 施策 PLATFORM BLOCKS ───
function addSP(){
  spC++;
  const id=spC;
  const d=document.createElement('div');
  d.className='sp-block'; d.id=`sp-${id}`; d.dataset.id=id;
  d.innerHTML=`<div class="sp-hd"><select id="spn-${id}">${pOpts()}</select><button class="btn-x" onclick="rmEl('sp-${id}')">✕</button></div><div class="sp-body"><textarea id="spt-${id}" placeholder="この媒体の施策を入力"></textarea></div>`;
  document.getElementById('sessaku-platforms').appendChild(d);
}

// ─── RESULT PLATFORM BLOCKS ───
function addRP(period){
  rpC++;
  const rid=rpC;
  const d=document.createElement('div');
  d.className='rp-block'; d.id=`rp-${rid}`; d.dataset.rid=rid; d.dataset.period=period;
  d.innerHTML=`
    <div class="rp-block-hd">
      <span style="font-size:11px;color:var(--text-sub);flex-shrink:0">媒体</span>
      <select id="rpn-${rid}">${pOpts()}</select>
      <button class="btn-x" onclick="rmEl('rp-${rid}')">✕</button>
    </div>
    <div class="rp-metrics">
      <div class="mrow">
        <span class="mlabel">コスト</span>
        <div class="minput"><input type="text" id="rpc-${rid}" placeholder="199,747" oninput="fmtInput(this);calcCPA(${rid})"></div>
        <span class="munit">円</span>
      </div>
      <div class="mrow">
        <div class="mlabel-in"><input type="text" id="rpcvl-${rid}" value="CV" placeholder="CV" title="ラベル変更可（例：CV（フォーム送信））"></div>
        <div class="minput"><input type="text" id="rpcv-${rid}" placeholder="0" oninput="calcCPA(${rid})"></div>
        <span class="munit">件</span>
        <button class="btn-add sm" onclick="addSubCV(${rid})" title="└サブCV追加">＋└</button>
      </div>
      <div id="subcvs-${rid}" style="display:flex;flex-direction:column;gap:4px"></div>
      <div class="mrow">
        <div class="mlabel-in"><input type="text" id="rppal-${rid}" value="CPA" placeholder="CPA" title="ラベル変更可（例：CPA（フォーム送信＋AI音声視聴））"></div>
        <div class="minput"><input type="text" id="rppa-${rid}" class="cpa-auto" readonly placeholder="自動計算"></div>
        <span class="munit">円</span>
      </div>
      <div style="margin-top:2px">
        <div style="font-size:10px;color:var(--text-dim);margin-bottom:3px">分類別内訳テキスト（任意）▸ ------区切り行として挿入</div>
        <textarea id="rpbd-${rid}" style="min-height:40px;font-size:11px;line-height:1.5" placeholder="例：中学生：CV13件、CPA16,163円&#10;小学生：CV1件、CPA122,598円"></textarea>
      </div>
      <div id="ems-${rid}" style="display:flex;flex-direction:column;gap:5px"></div>
      <button class="btn-add sm" style="margin-top:2px" onclick="addEM(${rid})">＋ 指標追加（CTR・CPC・MCVなど）</button>
    </div>`;
  document.getElementById(`${period}-platforms`).appendChild(d);
}

// ─── CPA AUTO-CALC ───
function calcCPA(rid){
  const cost=parseNum(document.getElementById(`rpc-${rid}`).value);
  const cv=parseNum(document.getElementById(`rpcv-${rid}`).value);
  const el=document.getElementById(`rppa-${rid}`);
  if(cost>0 && cv>0) el.value=fmtN(Math.round(cost/cv));
  else if(cost>0 && cv===0) el.value='-';
  else el.value='';
}

// ─── SUB-CVs ───
function addSubCV(rid){
  scC++;
  const sid=scC;
  const d=document.createElement('div');
  d.className='subcv-row'; d.dataset.sid=sid; d.id=`scv-${sid}`;
  d.innerHTML=`<span class="subcv-prefix">└</span><input class="subcv-name" type="text" id="scvn-${sid}" placeholder="電話・Eメール等"><span style="font-size:11px;color:var(--text-dim)">：</span><input class="subcv-val" type="text" id="scvv-${sid}" placeholder="0"><span style="font-size:11px;color:var(--text-dim)">件</span><button class="btn-x" onclick="rmEl('scv-${sid}')">✕</button>`;
  document.getElementById(`subcvs-${rid}`).appendChild(d);
}

// ─── EXTRA METRICS ───
function addEM(rid){
  emC++;
  const eid=emC;
  const d=document.createElement('div');
  d.className='em-block'; d.id=`em-${eid}`; d.dataset.eid=eid;
  d.innerHTML=`
    <div class="em-row">
      <input class="em-name" type="text" id="emn-${eid}" placeholder="指標名（例：CTR、MCV）">
      <span style="font-size:11px;color:var(--text-dim)">：</span>
      <input class="em-val" type="text" id="emv-${eid}" placeholder="値">
      <input class="em-unit" type="text" id="emu-${eid}" placeholder="単位（例：％）">
      <button class="btn-x" onclick="rmEl('em-${eid}')">✕</button>
    </div>
    <div id="emsubs-${eid}" style="display:flex;flex-direction:column;gap:3px"></div>
    <button class="btn-add sm" onclick="addSM(${eid})">＋ └サブ項目</button>`;
  document.getElementById(`ems-${rid}`).appendChild(d);
}
function addSM(eid){
  smC++;
  const smid=smC;
  const d=document.createElement('div');
  d.className='sm-row'; d.id=`sm-${smid}`; d.dataset.smid=smid;
  d.innerHTML=`<span class="sm-prefix">└</span><input type="text" id="smn-${smid}" placeholder="名前" style="flex:2;padding:3px 5px;font-size:11px"><span style="font-size:10px;color:var(--text-dim)">：</span><input type="text" id="smv-${smid}" placeholder="値" style="flex:2;padding:3px 5px;font-size:11px"><input type="text" id="smu-${smid}" placeholder="単位" style="flex:1;padding:3px 5px;font-size:11px"><button class="btn-x" onclick="rmEl('sm-${smid}')">✕</button>`;
  document.getElementById(`emsubs-${eid}`).appendChild(d);
}

// ─── 所感 PLATFORM ───
function toggleKansou(){
  const per=document.getElementById('kansouPer').checked;
  document.getElementById('kansou-general').style.display=per?'none':'block';
  document.getElementById('kansou-per').style.display=per?'flex':'none';
}
function addKP(){
  kpC++;
  const kid=kpC;
  const d=document.createElement('div');
  d.className='kp-block'; d.id=`kp-${kid}`;
  d.innerHTML=`<div class="kp-hd"><select id="kpn-${kid}">${pOpts()}</select><button class="btn-x" onclick="rmEl('kp-${kid}')">✕</button></div><div class="kp-body"><textarea id="kpt-${kid}" placeholder="この媒体の結果・所感を入力"></textarea></div>`;
  document.getElementById('kansou-list').appendChild(d);
}

function rmEl(id){ const e=document.getElementById(id); if(e) e.remove(); }

// ─── OUTPUT GENERATION ───
function pushLines(arr, text){
  if(!text) return;
  text.split('\n').forEach(l => arr.push(l));
}

function appendMetrics(lines, rid){
  const cost = document.getElementById(`rpc-${rid}`).value.trim();
  const cvL = document.getElementById(`rpcvl-${rid}`).value.trim() || 'CV';
  const cv = document.getElementById(`rpcv-${rid}`).value.trim();
  const cpaL = document.getElementById(`rppal-${rid}`).value.trim() || 'CPA';
  const cpa = document.getElementById(`rppa-${rid}`).value.trim();
  const bd = document.getElementById(`rpbd-${rid}`).value.trim();

  if(cost) lines.push(`コスト：${cost}円`);
  if(cv!=='') lines.push(`${cvL}：${cv}件`);

  document.querySelectorAll(`#subcvs-${rid} .subcv-row`).forEach(row => {
    const sid=row.dataset.sid;
    const n=document.getElementById(`scvn-${sid}`).value.trim();
    const v=document.getElementById(`scvv-${sid}`).value.trim();
    if(n&&v!=='') lines.push(`└${n}：${v}件`);
  });

  if(bd){ lines.push('------'); bd.split('\n').forEach(l=>{if(l.trim())lines.push(l);}); lines.push('------'); }

  if(cpa) lines.push(`${cpaL}：${cpa}円`);

  document.querySelectorAll(`#ems-${rid} .em-block`).forEach(block=>{
    const eid=block.dataset.eid;
    const en=document.getElementById(`emn-${eid}`).value.trim();
    const ev=document.getElementById(`emv-${eid}`).value.trim();
    const eu=document.getElementById(`emu-${eid}`).value.trim();
    if(en){
      lines.push(`${en}：${ev}${eu}`);
      block.querySelectorAll('.sm-row').forEach(sr=>{
        const smid=sr.dataset.smid;
        const sn=document.getElementById(`smn-${smid}`).value.trim();
        const sv=document.getElementById(`smv-${smid}`).value.trim();
        const su=document.getElementById(`smu-${smid}`).value.trim();
        if(sn&&sv!=='') lines.push(`└${sn}：${sv}${su}`);
      });
    }
  });
}

function generate(){
  const style = document.getElementById('formatStyle').value;
  const sym = document.getElementById('monthSymbol').value;
  const lines = [];

  // 01 現状の課題
  lines.push('■現状の課題');
  pushLines(lines, document.getElementById('kadai').value.trim());
  lines.push('');

  // 02 前月の施策
  const sNote = document.getElementById('sessakuNote').value.trim();
  lines.push(`■前月の施策${sNote?`（${sNote}）`:''}`);
  const common = document.getElementById('sessaku-common').value.trim();
  const spBlocks = document.querySelectorAll('#sessaku-platforms .sp-block');
  if(spBlocks.length>0 && common){
    lines.push('＜共通＞'); pushLines(lines, common);
    spBlocks.forEach(b=>{
      const id=b.dataset.id;
      const n=document.getElementById(`spn-${id}`).value;
      const t=document.getElementById(`spt-${id}`).value.trim();
      if(t){ lines.push(`＜${n}＞`); pushLines(lines, t); }
    });
  } else if(spBlocks.length>0){
    spBlocks.forEach(b=>{
      const id=b.dataset.id;
      const n=document.getElementById(`spn-${id}`).value;
      const t=document.getElementById(`spt-${id}`).value.trim();
      if(t){ lines.push(`＜${n}＞`); pushLines(lines, t); }
    });
  } else {
    pushLines(lines, common);
  }
  lines.push('');

  // 03 前月の結果
  const rh = document.getElementById('resultHeader').value.trim() || '前月の結果';
  lines.push(`■${rh}`);
  const useSep = document.getElementById('useSep').checked;
  const useKHd = document.getElementById('useKansouHd').checked;

  if(style==='A'){
    ['prev','curr'].forEach((period,pi)=>{
      if(useSep) lines.push('-----------------');
      const title=document.getElementById(`${period}-title`).value.trim();
      const note=document.getElementById(`${period}-note`).value.trim();
      document.querySelectorAll(`#${period}-platforms .rp-block`).forEach(b=>{
        const rid=b.dataset.rid;
        const pname=document.getElementById(`rpn-${rid}`).value;
        lines.push(`${sym}＜${pname}＞${title}${note?note:''}`);
        appendMetrics(lines, rid);
      });
    });
    if(useSep) lines.push('-----------------');
  } else if(style==='B'){
    ['prev','curr'].forEach(period=>{
      const title=document.getElementById(`${period}-title`).value.trim();
      const note=document.getElementById(`${period}-note`).value.trim();
      lines.push(`${sym}${title}${note?note:''}`);
      document.querySelectorAll(`#${period}-platforms .rp-block`).forEach(b=>{
        const rid=b.dataset.rid;
        const pname=document.getElementById(`rpn-${rid}`).value;
        lines.push(`【${pname}】`);
        appendMetrics(lines, rid);
      });
    });
  } else {
    // Style C
    ['prev','curr'].forEach((period,pi)=>{
      if(pi>0 && useSep) lines.push('------');
      const title=document.getElementById(`${period}-title`).value.trim();
      const note=document.getElementById(`${period}-note`).value.trim();
      lines.push(`${sym}${title}${note?note:''}`);
      document.querySelectorAll(`#${period}-platforms .rp-block`).forEach(b=>{
        appendMetrics(lines, b.dataset.rid);
      });
    });
    if(useSep) lines.push('------');
  }

  // 結果/所感
  if(useKHd) lines.push('【結果/所感】');
  const perKansou = document.getElementById('kansouPer').checked;
  if(perKansou){
    document.querySelectorAll('#kansou-list .kp-block').forEach(b=>{
      const kid=b.id.replace('kp-','');
      const pname=document.getElementById(`kpn-${kid}`).value;
      const text=document.getElementById(`kpt-${kid}`).value.trim();
      if(text){
        if(style==='A') lines.push(`＜${pname}広告＞`);
        else if(style==='B') lines.push(`${pname}：`);
        else lines.push(`＜${pname}＞`);
        pushLines(lines, text);
      }
    });
  } else {
    pushLines(lines, document.getElementById('kansou-text').value.trim());
  }
  lines.push('');

  // 04 今後の対策
  lines.push('■今後の対策（ネクストアクション）');
  pushLines(lines, document.getElementById('naction').value.trim());

  document.getElementById('output').value = lines.join('\n');
}

function copyOutput(){
  const ta=document.getElementById('output');
  if(!ta.value) return;
  navigator.clipboard.writeText(ta.value).then(()=>{
    const btn=document.getElementById('copyBtn');
    btn.textContent='✓ コピー完了'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='コピー'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
